[project]
name = "medicalexpensehsa"
version = "0.1.0"
description = "Automated medical expense HSA claim processing and filing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-ai-slim[anthropic,google,openai]>=0.0.13",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "playwright>=1.48.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.6.2",
    "ruff>=0.8.0",
]

[project.scripts]
hsa-agent = "src.main:cli"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
